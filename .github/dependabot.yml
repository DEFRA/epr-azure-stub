version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: daily
      time: '10:30'
      timezone: 'Europe/London'
    groups:
      nuget-test-support:
        applies-to: version-updates
        patterns:
          - 'Microsoft.AspNetCore.Mvc.Testing'
          - 'Microsoft.NET.Test.Sdk'
          - 'NSubstitute'
          - 'xunit*'
        update-types:
          - 'minor'
          - 'patch'
      nuget-observability:
        applies-to: version-updates
        patterns:
          - 'Elastic.*'
          - 'Serilog.*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

  - package-ecosystem: docker-compose
    directory: /
    ignore:
      # Keep Mongo on its existing major version while allowing minor and patch updates.
      - dependency-name: 'mongo'
        update-types:
          - 'version-update:semver-major'
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
